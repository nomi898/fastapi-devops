name: Deploy FastAPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/devops_bootcamp/fastapi-devops

            git pull origin main

            docker build -t fastapi-devops:latest .

            docker stop fastapi-nk || true
            docker rm fastapi-nk || true

            docker run -d \
              --name fastapi-nk \
              --restart unless-stopped \
              -p 8001:8000 \
              fastapi-devops:latest

            docker ps
